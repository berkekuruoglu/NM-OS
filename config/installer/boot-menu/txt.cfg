default nmos-install

label nmos-install
    menu label ^Install NM-OS (erases the target disk)
    menu default
    kernel /install.amd/vmlinuz
    append auto=true priority=critical preseed/file=/cdrom/preseed/nmos.cfg initrd=/install.amd/initrd.gz ---
    text help
      Installs NM-OS automatically. No other choices are needed.
    endtext

label nmos-rescue
    menu label ^Advanced: rescue an existing installation
    kernel /install.amd/vmlinuz
    append rescue/enable=true initrd=/install.amd/initrd.gz --- quiet
