set default=0
set timeout=-1
set timeout_style=menu
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry 'Install NM-OS (erases the target disk)' --id=nmos-install {
    echo 'Starting NM-OS setup. No other choices are needed.'
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed/nmos.cfg ---
    initrd /install.amd/initrd.gz
}

submenu 'Advanced options' {
    menuentry 'Rescue an existing installation' {
        linux /install.amd/vmlinuz rescue/enable=true --- quiet
        initrd /install.amd/initrd.gz
    }

    menuentry 'Debian manual installer' {
        linux /install.amd/vmlinuz vga=788 --- quiet
        initrd /install.amd/initrd.gz
    }
}
